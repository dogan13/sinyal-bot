name: Sinyal Botu

on:
  schedule:
    - cron: "4 * * * *"     # her saat, dakika 4 (mum kapandiktan sonra)
  workflow_dispatch:         # elle calistirma dugmesi
    inputs:
      test:
        description: "Sadece Telegram baglanti testi yap (true/false)"
        default: "false"

permissions:
  contents: write

concurrency:
  group: sinyal
  cancel-in-progress: false

jobs:
  calistir:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install pandas numpy requests

      - name: Botu calistir
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event.inputs.test }}" = "true" ]; then
            python bot.py --test
          else
            python bot.py
          fi

      - name: Durumu kaydet
        run: |
          git config user.name "sinyal-bot"
          git config user.email "sinyal-bot@users.noreply.github.com"
          git add durum.json || true
          git diff --cached --quiet || (git commit -m "durum guncellendi" && git push)
